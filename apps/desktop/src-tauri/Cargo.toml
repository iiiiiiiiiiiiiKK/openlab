[package]
name = "openlab-desktop"
version = "0.1.0"
description = "OPENLAB desktop shell"
authors = ["0xkillcoin"]
license = "MIT"
edition = "2021"
rust-version = "1.77"
default-run = "openlab-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
