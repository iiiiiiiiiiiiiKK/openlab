[pytest]
minversion = 8.0
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -p no:cacheprovider --strict-markers
markers =
    e2e: real end-to-end runs (may need Docker, Node or network access)
    slow: long running test
filterwarnings =
    ignore::DeprecationWarning
